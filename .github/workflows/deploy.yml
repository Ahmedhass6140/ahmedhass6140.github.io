name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A29B32: ${{ secrets.A29B32 }}
          B49CB3: ${{ secrets.B49CB3 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A29B32', '')
          bm = os.environ.get('B49CB3', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 3da73552db2aa6c9c204c4e91dc8edc55d6b427b747c98ef -->', gm)
          if bm:
              s2 = s2.replace('<!-- 8c90609b528788b84864 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
